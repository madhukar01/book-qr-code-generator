<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book QR Code Generator</title>

<!-- QR CODE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.form{
    display:grid;
    gap:15px;
}

label{
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#667eea;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:10px;
}

button{
    flex:1;
    min-width:150px;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.generate{
    background:#667eea;
    color:white;
}

.reset{
    background:#eee;
    color:#333;
}

.download{
    background:#28a745;
    color:white;
    display:none;
}

.qr-section{
    text-align:center;
    margin-top:30px;
    padding-top:25px;
    border-top:1px solid #ddd;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin:20px 0;
}

.book-info{
    display:none;
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.book-info p{
    margin:7px 0;
}

.error{
    color:red;
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}

.viewer{
    display:none;
}

.viewer iframe{
    width:100%;
    height:600px;
    border:1px solid #ddd;
    border-radius:10px;
}

.viewer-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.viewer-buttons a,
.viewer-buttons button{
    text-decoration:none;
    text-align:center;
    padding:13px;
    border-radius:10px;
    flex:1;
    font-weight:bold;
}

.open-pdf{
    background:#667eea;
    color:white;
}

.download-pdf{
    background:#28a745;
    color:white;
}

.close-viewer{
    background:#dc3545;
    color:white;
    border:none;
}

@media(max-width:600px){
    .container{
        padding:22px;
    }

    .viewer iframe{
        height:450px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- GENERATOR -->
    <div id="generator">

        <h1>📚 Book QR Code Generator</h1>

        <p class="subtitle">
            Generate a QR Code for your Book PDF
        </p>

        <div class="form">

            <div>
                <label>Book Name</label>
                <input type="text" id="bookName"
                       placeholder="Enter book name">
            </div>

            <div>
                <label>Author Name</label>
                <input type="text" id="authorName"
                       placeholder="Enter author name">
            </div>

            <div>
                <label>PDF Link</label>
                <input type="url" id="pdfLink"
                       placeholder="Paste your PDF link here">
            </div>

            <div class="buttons">

                <button class="generate"
                        onclick="generateQR()">
                    Generate QR Code
                </button>

                <button class="reset"
                        onclick="resetForm()">
                    Reset
                </button>

            </div>

            <div id="error" class="error"></div>

        </div>

        <div class="qr-section">

            <h2>Generated QR Code</h2>

            <div id="qrcode"></div>

            <div id="bookInfo" class="book-info">
                <p><strong>Book:</strong>
                    <span id="displayBook"></span>
                </p>

                <p><strong>Author:</strong>
                    <span id="displayAuthor"></span>
                </p>
            </div>

            <button id="downloadQR"
                    class="download"
                    onclick="downloadQR()">
                Download QR Code
            </button>

        </div>

    </div>


    <!-- PDF VIEWER -->
    <div id="viewer" class="viewer">

        <h1>📖 Book PDF</h1>

        <p class="subtitle">
            Your PDF is ready to view
        </p>

        <iframe id="pdfFrame"></iframe>

        <div class="viewer-buttons">

            <a id="openPDF"
               class="open-pdf"
               target="_blank">
                Open PDF
            </a>

            <a id="downloadPDF"
               class="download-pdf"
               target="_blank">
                Download PDF
            </a>

            <button class="close-viewer"
                    onclick="closeViewer()">
                Close
            </button>

        </div>

    </div>

</div>


<script>

/* ================================
   GENERATE QR CODE
================================ */

function generateQR(){

    const bookName =
        document.getElementById("bookName").value.trim();

    const authorName =
        document.getElementById("authorName").value.trim();

    const pdfLink =
        document.getElementById("pdfLink").value.trim();

    const error =
        document.getElementById("error");

    error.innerHTML = "";

    if(bookName === ""){
        error.innerHTML = "Please enter the book name.";
        return;
    }

    if(authorName === ""){
        error.innerHTML = "Please enter the author name.";
        return;
    }

    if(pdfLink === ""){
        error.innerHTML = "Please enter the PDF link.";
        return;
    }

    if(!pdfLink.startsWith("http://") &&
       !pdfLink.startsWith("https://")){

        error.innerHTML =
            "Please enter a valid PDF link starting with https://";

        return;
    }

    /* Check QR library */

    if(typeof QRCode === "undefined"){

        error.innerHTML =
            "QR Code library could not load. Please refresh the page.";

        return;
    }

    /* Clear old QR */

    document.getElementById("qrcode").innerHTML = "";

    /*
       Current website URL
       Example:
       https://madhukar01.github.io/book-qr-code-generator/
    */

    const currentPage =
        window.location.href.split("?")[0];

    /*
       QR will open this same website
       and then show the PDF.
    */

    const viewerLink =
        currentPage + "?pdf=" +
        encodeURIComponent(pdfLink);

    /* Generate QR */

    new QRCode(
        document.getElementById("qrcode"),
        {
            text: viewerLink,
            width:230,
            height:230,
            colorDark:"#000000",
            colorLight:"#ffffff",
            correctLevel:QRCode.CorrectLevel.H
        }
    );

    /* Show book information */

    document.getElementById("displayBook")
        .innerText = bookName;

    document.getElementById("displayAuthor")
        .innerText = authorName;

    document.getElementById("bookInfo")
        .style.display = "block";

    document.getElementById("downloadQR")
        .style.display = "block";
}


/* ================================
   DOWNLOAD QR CODE
================================ */

function downloadQR(){

    const qr =
        document.querySelector("#qrcode img");

    if(!qr){
        alert("Please generate the QR code first.");
        return;
    }

    const link =
        document.createElement("a");

    link.href = qr.src;

    link.download = "Book_QR_Code.png";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}


/* ================================
   RESET
================================ */

function resetForm(){

    document.getElementById("bookName").value = "";

    document.getElementById("authorName").value = "";

    document.getElementById("pdfLink").value = "";

    document.getElementById("qrcode").innerHTML = "";

    document.getElementById("bookInfo").style.display = "none";

    document.getElementById("downloadQR").style.display = "none";

    document.getElementById("error").innerHTML = "";
}


/* ================================
   OPEN PDF VIEWER
================================ */

function openPDFViewer(pdf){

    document.getElementById("generator")
        .style.display = "none";

    document.getElementById("viewer")
        .style.display = "block";

    document.getElementById("pdfFrame")
        .src = pdf;

    document.getElementById("openPDF")
        .href = pdf;

    document.getElementById("downloadPDF")
        .href = pdf;

    document.getElementById("downloadPDF")
        .download = "";
}


/* ================================
   CLOSE PDF VIEWER
================================ */

function closeViewer(){

    document.getElementById("viewer")
        .style.display = "none";

    document.getElementById("generator")
        .style.display = "block";

    document.getElementById("pdfFrame")
        .src = "";
}


/* ================================
   CHECK QR URL
================================ */

const parameters =
    new URLSearchParams(window.location.search);

const pdf =
    parameters.get("pdf");

if(pdf){

    openPDFViewer(pdf);

}

</script>

</body>
</html>
